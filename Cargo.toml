[workspace]
members = [
    "crates/sim-config",
    "crates/sim-core",
    "crates/sim-headless",
    "crates/sim-viewer",
    "crates/sim-world",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
sim-core = { path = "crates/sim-core" }
sim-config = { path = "crates/sim-config" }
sim-world = { path = "crates/sim-world" }
rayon = "1.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
postcard = { version = "1.0.10", default-features = false, features = ["use-std"] }
toml = "1.1.2"

[profile.release]
lto = "fat"
codegen-units = 1
