[workspace]
members = ["crates/sim-config", "crates/sim-core", "crates/sim-headless", "crates/sim-viewer"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
sim-core = { path = "crates/sim-core" }
sim-config = { path = "crates/sim-config" }
rayon = "1.10.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"

[profile.release]
lto = "thin"
codegen-units = 1
