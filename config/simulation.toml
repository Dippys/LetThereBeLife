[simulation]
seed = 1
ticks_per_second = 60

[world]
# Deterministic bootstrap extent: the viewer streams it after opening, while
# headless explicitly materializes it before ticks. It is not the world maximum.
initial_width = 4096
initial_height = 4096

[world_cache]
# Load the complete finite-world archive and immediate whole-world overview.
# If it is absent, stale, corrupt, or does not match the seed, deterministic
# generation remains available. Create/refresh the multi-gigabyte archive with:
# cargo run --release -p sim-viewer -- --pregenerate-world
enabled = true
path = "target/world-cache/seed-1-full-world.ltbl-archive"
